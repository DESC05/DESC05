<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#111C2E"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 70) rotate(140) scale(430 300)">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#334155" fill-opacity="0.55"/>
    </pattern>
    <style>
      .hola { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94A3B8; }
      .nombre { font: 800 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.5px; }
      .rol { font: 600 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F59E0B; }
      .detalle { font: 500 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94A3B8; letter-spacing: 2px; }
      .codigo { font: 500 15px Consolas, 'Courier New', monospace; }
      .cursor { animation: parpadeo 1.1s steps(1) infinite; }
      @keyframes parpadeo { 50% { opacity: 0; } }
      .barrido { animation: barrer 6s ease-in-out infinite; }
      @keyframes barrer { 0% { transform: translateX(-520px); } 100% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .barrido { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#fondo)"/>
  <rect width="1200" height="300" rx="18" fill="url(#puntos)"/>
  <rect width="1200" height="300" rx="18" fill="url(#brillo)"/>

  <text class="hola" x="70" y="88">Hola, soy</text>
  <text class="nombre" x="66" y="152">Dereck Castro</text>
  <text class="rol" x="70" y="196">Jefe de equipo · Desarrollador full-stack</text>
  <text class="detalle" x="70" y="240">ING ASESORÍA EMPRESARIAL · ECUADOR</text>

  <!-- Ventana de código -->
  <g transform="translate(790 58)">
    <rect width="340" height="184" rx="12" fill="#0B1220" stroke="#334155"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="38" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="5" fill="#22C55E"/>
    <line x1="0" y1="34" x2="340" y2="34" stroke="#1E293B"/>
    <text class="codigo" x="18" y="62"><tspan fill="#C084FC">const</tspan><tspan fill="#E2E8F0"> dereck = {</tspan></text>
    <text class="codigo" x="34" y="86"><tspan fill="#7DD3FC">rol</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#FCD34D">"Jefe de equipo"</tspan><tspan fill="#E2E8F0">,</tspan></text>
    <text class="codigo" x="34" y="110"><tspan fill="#7DD3FC">stack</tspan><tspan fill="#E2E8F0">: [</tspan><tspan fill="#FCD34D">"React"</tspan><tspan fill="#E2E8F0">, </tspan><tspan fill="#FCD34D">"PHP"</tspan><tspan fill="#E2E8F0">],</tspan></text>
    <text class="codigo" x="34" y="134"><tspan fill="#7DD3FC">objetivo</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#FCD34D">"cuadrar al centavo"</tspan></text>
    <text class="codigo" x="18" y="158"><tspan fill="#E2E8F0">};</tspan><tspan class="cursor" fill="#F59E0B"> ▌</tspan></text>
  </g>

  <rect x="0" y="294" width="1200" height="6" fill="#1E293B"/>
  <rect class="barrido" x="0" y="294" width="520" height="6" fill="url(#linea)"/>
</svg>
